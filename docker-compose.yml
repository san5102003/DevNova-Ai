services:
  postgres:
    image: postgres:16-alpine
    container_name: devnova-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: devnova
      POSTGRES_USER: devnova
      POSTGRES_PASSWORD: devnovapassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devnova-network

  redis:
    image: redis:7-alpine
    container_name: devnova-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - devnova-network

volumes:
  pgdata:
  redisdata:

networks:
  devnova-network:
    driver: bridge
