spring:
  config:
    import: optional:classpath:/application-local.yml
  application:
    name: devnova-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/devnova}}
    username: ${SPRING_DATASOURCE_USERNAME:devnova}
    password: ${SPRING_DATASOURCE_PASSWORD:devnovapassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

server:
  port: 8080

# Application Custom Properties
app:
  jwt:
    # 256-bit key for HMAC-SHA256 (base64-encoded string representation of 32+ bytes key)
    # Using a pre-defined secret key for development, can be configured via environment
    secret: dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLXNlY3JldC1rZXktZm9yLWRldm5vdmEtYWktY2xvdWQtaWRlLXN5c3RlbQ==
    expirationMs: 86400000 # 24 Hours
  execution:
    timeoutSeconds: 60
    tempDir: d:/DevNova AI/backend/temp-execution
  ai:
    openai:
      key: ${OPENROUTER_API_KEY:${OPENAI_API_KEY:your_api_key_here}}
      model: openai/gpt-4o-mini
      base-url: https://openrouter.ai/api/v1
